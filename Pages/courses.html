<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Malaika Junaid Courses</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <!-- Malaika Junaid Courses -->
    <section class="courses-section-container" id="courses">
      <div class="courses-section">
        <div class="section-heading" data-aos="fade-up">
          <h2 class="section-heading-article" tabindex="0" aria-label="courses heading">
            &#60;/Courses&#62;
          </h2>
          <p class="sectionHeadingP">Explore my online certifications and technical courses</p>
        </div>

        <div class="courses-boxes-div">
          <!-- Course 1 -->
          <div data-aos="fade-up" class="courses-box-wrapper">
            <div class="courses-box">
              <div class="info-div">
                <img src="./src/pngs/placeholder.png" alt="course thumbnail" class="faviconforCourses" />
                <article class="CoursesHeading">Course Title Here</article>
                <div class="courses-buttons">
                  <a href="#" target="_blank" class="threads-redirect" aria-label="Visit Certificate">
                    <img src="src/svg/github.svg" alt="threads redirect button" />
                  </a>
                  <a href="#" target="_blank" class="cta" aria-label="View Credentials">
                    <span>View Credentials</span>
                    <svg viewBox="0 0 13 10" height="10px" width="15px">
                      <path d="M1,5 L11,5"></path>
                      <polyline points="8 1 12 5 8 9"></polyline>
                    </svg>
                  </a>
                </div>
              </div>
              <div class="image-div">
                <img src="src/webp/placeholder.webp" alt="course visual" />
              </div>
            </div>
          </div>

          <!-- Course 2 -->
          <div data-aos="fade-up" class="courses-box-wrapper">

                      <path d="M1,5 L11,5"></path>

                    </svg>
                  </a>
                </div>
              </div>
              <div class="image-div">
                <img src="src/webp/placeholder.webp" alt="course visual" />
              </div>
            </div>
          </div>

          <!-- Course 3 -->
          <div data-aos="fade-up" class="courses-box-wrapper">

                      <path d="M1,5 L11,5"></path>

                    </svg>
                  </a>

              </div>
              <div class="image-div">
                <img src="src/webp/placeholder.webp" alt="course visual" />

          </div>

        </div>
      </div>
    </section>
    <!-- Malaika Junaid Courses ends -->
